[project]
name = "kanso"
version = "0.1.0"
description = "Automatic macOS file sorter: Apple on-device model sorts what the extension table cannot."
readme = "README.md"
authors = [
    { name = "Ahmed Ayman", email = "535126+AhmedAymanM@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "von-sdk>=1.2.2",
]

[project.scripts]
kanso = "kanso:main"

[project.optional-dependencies]
apple = [
    "apple-fm-sdk",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "decider-ai>=1.4.0",
    "laya>=0.3.20",
    "rlcd",
]

[tool.uv.sources]
rlcd = { git = "https://github.com/Heman10x-NGU/Verdict-open-jev" }
